name: Godot Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Validate project
        shell: bash
        run: |
          set -e
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
          timeout 20s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 10

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Android" build/game-unsigned.apk
          test -s build/game-unsigned.apk

      - name: Create signing key
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore build/release.keystore \
            -alias streetfootball \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Street Football Pakistan, OU=Game, O=Street Football Pakistan, L=Pakistan, C=PK"

      - name: Align and sign APK
        shell: bash
        run: |
          set -e
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 build/game-unsigned.apk build/game-aligned.apk
          "$APKSIGNER" sign \
            --ks build/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias streetfootball \
            --out build/Street-Football-Pakistan.apk \
            build/game-aligned.apk
          "$APKSIGNER" verify --verbose build/Street-Football-Pakistan.apk
          test -s build/Street-Football-Pakistan.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Street-Football-Pakistan-APK
          path: build/Street-Football-Pakistan.apk
          if-no-files-found: error
          retention-days: 30
