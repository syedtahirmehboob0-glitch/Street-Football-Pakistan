name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.2
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot and Android build resources
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle-cache
            ~/.cache/android
            android
          key: android-godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ hashFiles('project.godot', 'export_presets.cfg', '.github/workflows/build-test-apk.yml') }}
          restore-keys: |
            android-godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-

      - name: Install Godot 4.5.2
        shell: bash
        run: |
          set -e
          if command -v godot >/dev/null 2>&1; then exit 0; fi
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -f "$T/android_source.zip" ] && [ -f "$T/android_debug.apk" ]; then exit 0; fi
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p "$T"
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          cp -r templates/* "$T/"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure headless Android export
        shell: bash
        run: |
          set -e
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_SDK_PATH=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/godot-editor"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/godot-editor/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare project for CI export
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/efootball_polish.gd")
          s = p.read_text()
          old = 'draw_style_box(panel(Color(0.01, 0.03, 0.04, 0.88), 14, Color(1, 1, 1, 0.16), 1), Rect2(Vector2.ZERO, size))'
          new = 'draw_rect(Rect2(Vector2.ZERO, size), Color(0.01, 0.03, 0.04, 0.88), true)'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          sed -i 's/^export_path=".*"$/export_path=""/' export_presets.cfg

      - name: Godot project validation
        run: godot --headless --editor --path . --editor-settings-dir "$RUNNER_TEMP/godot-editor" --quit

      - name: Install Android Gradle build template into project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          timeout 3m godot --headless --editor --path . --editor-settings-dir "$RUNNER_TEMP/godot-editor" --install-android-build-template
          test -f android/build.gradle || test -f android/build.gradle.kts
          echo "Android Gradle build template installed successfully"

      - name: Export debug APK
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/build"
          timeout 15m godot --headless --path . --editor-settings-dir "$RUNNER_TEMP/godot-editor" --export-debug "Android" "build/Street-Football-Pakistan-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/Street-Football-Pakistan-debug.apk"
          file "$GITHUB_WORKSPACE/build/Street-Football-Pakistan-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Street-Football-Pakistan-debug-apk
          path: build/Street-Football-Pakistan-debug.apk
